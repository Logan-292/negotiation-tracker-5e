name: Release

# Запускается, когда на GitHub нажимаете «Publish release».
# Название тега должно быть вида v1.2.0 — оно станет версией модуля.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Прописать версию и ссылки в module.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="${GITHUB_REPOSITORY}"
          jq --arg v "$VERSION" \
             --arg url "https://github.com/$REPO" \
             --arg manifest "https://github.com/$REPO/releases/latest/download/module.json" \
             --arg download "https://github.com/$REPO/releases/download/$GITHUB_REF_NAME/module.zip" \
             --arg changelog "https://github.com/$REPO/releases/tag/$GITHUB_REF_NAME" \
             --arg bugs "https://github.com/$REPO/issues" \
             '.version=$v | .url=$url | .manifest=$manifest | .download=$download | .changelog=$changelog | .bugs=$bugs' \
             module.json > module.tmp && mv module.tmp module.json
          cat module.json

      - name: Собрать module.zip
        run: zip -r module.zip module.json README.md scripts templates styles lang

      - name: Приложить файлы к релизу
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
